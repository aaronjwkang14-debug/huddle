<style>
:root{
  --bg:#f6f6f7; --panel:#ffffff; --panel2:#f1f1f3; --border:#e2e2e6;
  --text:#111111; --muted:#6b6b73; --accent:#e11d2e; --accent2:#b3121f;
  --mine:#e11d2e; --theirs:#ffffff; --danger:#e11d2e; --ok:#16a34a; --gold:#111111;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Nunito,system-ui,sans-serif;overflow:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}

/* ---------- auth ---------- */
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(circle at 20% 10%,rgba(225,29,46,.08),transparent 50%),var(--bg)}
.auth-card{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:28px 24px;box-shadow:0 12px 40px rgba(0,0,0,.08)}
.logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:6px}
.logo svg{width:38px;height:38px}
.logo h1{font-size:28px;font-weight:900;letter-spacing:.5px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:20px}
.tabs{display:flex;background:var(--panel2);border-radius:10px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;border:none;background:none;padding:9px;border-radius:8px;font-weight:800;color:var(--muted)}
.tabs button.on{background:#111;color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}
.field input,.inp{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);outline:none}
.field input:focus,.inp:focus{border-color:var(--accent)}
.btn{width:100%;padding:12px;border:none;border-radius:10px;background:#111;color:#fff;font-weight:900}
.btn:hover:not(:disabled){background:var(--accent)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
.btn.ghost:hover:not(:disabled){background:#e8e8ec}
.btn.red{background:var(--danger)}
.msg{font-size:13px;font-weight:700;border-radius:8px;padding:9px 11px;margin-bottom:12px}
.msg.err{background:#fdecee;color:#b3121f;border:1px solid #f5b5bb}
.msg.good{background:#eafaf0;color:#15803d;border:1px solid #b7e8c7}

/* ---------- app ---------- */
#app{display:flex;height:100%}
.side{width:320px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.side-top{display:flex;align-items:center;gap:8px;padding:14px 14px 10px}
.side-top .logo{margin:0}
.side-top .logo h1{font-size:20px}
.side-top .logo svg{width:28px;height:28px}
.me-btn{margin-left:auto;display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 10px 4px 4px;font-weight:800;font-size:13px;max-width:150px}
.me-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:flex;gap:6px;padding:0 14px 10px}
.seg button{flex:1;border:1px solid var(--border);background:var(--panel2);border-radius:9px;padding:8px;font-weight:800;font-size:13px;color:var(--muted);position:relative}
.seg button.on{color:#fff;border-color:#111;background:#111}
.badge{display:inline-block;min-width:18px;height:18px;line-height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:900;padding:0 5px;margin-left:5px}
.side-actions{padding:0 14px 10px;display:flex;gap:6px}
.side-actions .inp{padding:8px 10px;font-size:13px}
.side-actions button{flex:none;border:none;border-radius:9px;background:#111;color:#fff;font-weight:900;padding:0 12px;white-space:nowrap;font-size:13px}
.list{flex:1;overflow-y:auto;padding:4px 8px 12px}
.row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:10px;cursor:pointer;width:100%;border:none;background:none;text-align:left}
.row:hover{background:var(--panel2)}
.row.on{background:#fdecee}
.row .meta{flex:1;min-width:0}
.row .nm{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pv{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tm{font-size:11px;color:var(--muted);flex:none;align-self:flex-start;margin-top:3px}
.row.unread .nm{color:#000}
.row.unread .pv{color:var(--text);font-weight:800}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:24px 12px;line-height:1.5}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:15px;text-transform:uppercase}
.av.sm{width:28px;height:28px;font-size:12px}
.av.grp{border-radius:11px}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--panel)}
.chat-head .t{font-weight:900;font-size:16px}
.chat-head .s{font-size:12px;color:var(--muted)}
.chat-head .back{display:none;border:none;background:none;font-size:22px;padding:0 6px 0 0;color:var(--text)}
.chat-head .more{margin-left:auto;border:1px solid var(--border);background:var(--panel2);border-radius:9px;padding:6px 11px;font-weight:800;font-size:13px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:3px}
.day{align-self:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--panel2);border-radius:999px;padding:3px 10px;margin:10px 0 6px}
.b-wrap{display:flex;flex-direction:column;max-width:72%}
.b-wrap.mine{align-self:flex-end;align-items:flex-end}
.b-wrap.theirs{align-self:flex-start;align-items:flex-start}
.b-from{font-size:12px;font-weight:800;color:var(--muted);margin:8px 0 2px 4px}
.b-from.dev{color:#111}
.bubble{padding:8px 12px;border-radius:16px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;word-break:break-word}
.mine .bubble{background:var(--mine);color:#fff;border-bottom-right-radius:5px}
.theirs .bubble{background:var(--theirs);border:1px solid var(--border);border-bottom-left-radius:5px}
.bubble img{display:block;max-width:240px;max-height:300px;border-radius:10px;cursor:pointer}
.b-time{font-size:10.5px;color:var(--muted);margin:2px 6px 0}
.pending .bubble{opacity:.6}
.failed .b-time{color:var(--accent)}
.composer{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--border);background:var(--panel);align-items:flex-end}
.composer textarea{flex:1;resize:none;max-height:120px;min-height:42px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);outline:none;font-family:inherit;font-size:14.5px;color:var(--text)}
.composer textarea:focus{border-color:var(--accent)}
.icon-btn{width:42px;height:42px;flex:none;border-radius:12px;border:1px solid var(--border);background:var(--panel2);display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:20px;height:20px}
.send{background:var(--accent);border-color:var(--accent);color:#fff}
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);text-align:center;padding:20px}
.welcome svg{width:64px;height:64px;opacity:.85}
.welcome h2{color:var(--text);font-size:22px}

/* ---------- modal + toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{width:100%;max-width:420px;max-height:86vh;overflow-y:auto;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal h3{font-size:18px;margin-bottom:12px}
.modal .sect{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.modal .sect h4{font-size:13px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 6px 4px 10px;font-size:13px;font-weight:700}
.chip button{border:none;background:none;color:var(--muted);font-size:15px;line-height:1;padding:0 3px}
.pick{max-height:200px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;margin-top:6px}
.pick .row{border-radius:0;padding:7px 10px}
.row-btns{display:flex;gap:8px;margin-top:14px}
.row-btns .btn{flex:1}
#toasts{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#111;color:#fff;border:1px solid #111;border-radius:10px;padding:9px 14px;font-weight:800;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-width:90vw}
.toast.warn{background:var(--accent);border-color:var(--accent);color:#fff}
.toast.ok{border-left:4px solid var(--accent)}
.dev-tag{font-size:10px;font-weight:900;color:#fff;background:#111;border-radius:4px;padding:1px 4px;margin-left:5px;vertical-align:middle}

@media (max-width:760px){
  .side{width:100%;border-right:none}
  #app.chatting .side{display:none}
  #app:not(.chatting) .main{display:none}
  .chat-head .back{display:block}
  .b-wrap{max-width:84%}
}
.side-actions button:hover{background:var(--accent)}
.send:hover{background:var(--accent2)}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <symbol id="logo" viewBox="0 0 40 40">
    <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e11d2e"/><stop offset="1" stop-color="#b3121f"/></linearGradient></defs>
    <path d="M6 9a5 5 0 0 1 5-5h18a5 5 0 0 1 5 5v13a5 5 0 0 1-5 5H17l-7 6v-6a5 5 0 0 1-4-5z" fill="url(#lg)"/>
    <circle cx="14" cy="15.5" r="2.3" fill="#fff"/><circle cx="20" cy="15.5" r="2.3" fill="#fff"/><circle cx="26" cy="15.5" r="2.3" fill="#fff"/>
  </symbol>
</svg>

<!-- ============ AUTH ============ -->
<div id="auth">
  <div class="auth-card">
    <div class="logo"><svg><use href="#logo"/></svg><h1>Huddle</h1></div>
    <div class="sub">Chat with your people</div>
    <div class="tabs"><button id="tab-login" class="on" onclick="authTab('login')">Log In</button><button id="tab-signup" onclick="authTab('signup')">Sign Up</button></div>
    <div id="auth-msg" class="msg hidden"></div>
    <form id="f-login" onsubmit="doLogin();return false">
      <div class="field"><label>Username</label><input id="li-user" autocomplete="username" placeholder="Enter username"></div>
      <div class="field"><label>Password</label><input id="li-pass" type="password" autocomplete="current-password" placeholder="Enter password"></div>
      <button class="btn" id="li-btn">Log In</button>
    </form>
    <form id="f-signup" class="hidden" onsubmit="doSignup();return false">
      <div class="field"><label>Username</label><input id="su-user" autocomplete="username" placeholder="Choose a username"></div>
      <div class="field"><label>Password</label><input id="su-pass" type="password" autocomplete="new-password" placeholder="Choose a password"></div>
      <div class="field"><label>Confirm Password</label><input id="su-pass2" type="password" autocomplete="new-password" placeholder="Type it again"></div>
      <button class="btn" id="su-btn">Create Account</button>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside class="side">
    <div class="side-top">
      <div class="logo"><svg><use href="#logo"/></svg><h1>Huddle</h1></div>
      <button class="me-btn" onclick="openAccount()"><div class="av sm" id="me-av"></div><span id="me-name"></span></button>
    </div>
    <div class="seg">
      <button id="seg-dm" class="on" onclick="setTab('dm')">Messages<span class="badge hidden" id="bdg-dm"></span></button>
      <button id="seg-gc" onclick="setTab('gc')">Groups<span class="badge hidden" id="bdg-gc"></span></button>
    </div>
    <div class="side-actions" id="act-dm">
      <input class="inp" id="dm-search" placeholder="Find someone to message…" oninput="renderSide()">
    </div>
    <div class="side-actions hidden" id="act-gc">
      <button style="flex:1;padding:9px" onclick="openNewGroup()">+ New group chat</button>
    </div>
    <div class="list" id="side-list"></div>
  </aside>

  <main class="main">
    <div class="welcome" id="welcome">
      <svg><use href="#logo"/></svg>
      <h2>Welcome to Huddle</h2>
      <div>Pick a conversation, or search for someone to start one.</div>
    </div>
    <div id="chat" class="hidden" style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="chat-head">
        <button class="back" onclick="closeChat()">‹</button>
        <div class="av" id="ch-av"></div>
        <div><div class="t" id="ch-title"></div><div class="s" id="ch-sub"></div></div>
        <button class="more hidden" id="ch-more" onclick="openGroupInfo()">Group info</button>
      </div>
      <div class="msgs" id="msgs"></div>
      <div class="composer">
        <button class="icon-btn" title="Send a photo" onclick="document.getElementById('photo-in').click()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="m21 16-5-5-8 8"/></svg>
        </button>
        <input type="file" id="photo-in" accept="image/*" class="hidden" onchange="sendPhoto(this)">
        <textarea id="compose" rows="1" placeholder="Message…" maxlength="2000"></textarea>
        <button class="icon-btn send" title="Send" onclick="sendText()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
  </main>
</div>

<div id="modal-root"></div>
<div id="toasts"></div>

<script>
(function () {
  "use strict";

  // =====================================================================
  //  YOUR SUPABASE PROJECT — paste your two values between the quotes
  //  (Supabase → Project Settings → API / API Keys)
  // =====================================================================
  var SB  = "https://pmztsmwnzxtvuxeaflqy.supabase.co";        // looks like https://abcdefgh.supabase.co
  var KEY = "sb_publishable_CbI5Br-V8A1vtSlNnQK8UA_dm0Buh0e";    // starts with sb_publishable_  (or the "anon" key)
  // =====================================================================
  SB = SB.trim().replace(/\/+$/, "").replace(/\/rest\/v1$/, "");
  var HDR = { "apikey": KEY, "Content-Type": "application/json" };
  var DEV_USERS = ["dminfork"];
  var EVERYONE = "Everyone";
  var GRP = "grp::", DEVICES = "devices::";
  var NAME_RE = /^[A-Za-z0-9_.\-À-ÖØ-öø-ɏЀ-ӿก-ฺเ-๎ぁ-ゖァ-ヺー一-鿿가-힣]+$/;

  function withTimeout(p, ms) {
    return new Promise(function (res, rej) {
      var t = setTimeout(function () { rej(new Error("timeout")); }, ms);
      p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); });
    });
  }
  // Reads: key in the URL and no custom headers, so school/network filters don't stall them.
  function get(path, ms) {
    var url = SB + "/rest/v1/" + path + (path.indexOf("?") === -1 ? "?" : "&") + "apikey=" + encodeURIComponent(KEY);
    return withTimeout(fetch(url), ms || 15000).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    });
  }
  function send(method, path, body, prefer) {
    var h = Object.assign({}, HDR); if (prefer) h.Prefer = prefer;
    return withTimeout(fetch(SB + "/rest/v1/" + path, { method: method, headers: h, body: body ? JSON.stringify(body) : undefined }), 30000);
  }
  // Plain form writes skip the extra permission request; fall back to JSON if refused.
  var plainOk = null;
  function postRow(table, row) {
    function json() { return send("POST", table, row); }
    if (plainOk === false || typeof URLSearchParams === "undefined") return json();
    var f = new URLSearchParams();
    Object.keys(row).forEach(function (k) { if (row[k] != null) f.append(k, String(row[k])); });
    return withTimeout(fetch(SB + "/rest/v1/" + table + "?apikey=" + encodeURIComponent(KEY), { method: "POST", body: f }), 60000).then(function (r) {
      if (r.ok || r.status === 409) { plainOk = true; return r; }
      return r.text().then(function (t) {
        if ((r.status === 415 || /content.?type|media type|urlencoded|unsupported/i.test(t)) && plainOk !== true) { plainOk = false; return json(); }
        return new Response(t, { status: r.status });
      });
    });
  }
  function enc(v) { return encodeURIComponent(v); }
  function pgq(v) { return encodeURIComponent('"' + String(v).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"'); }
  function parseData(d) { if (typeof d === "string") { try { return JSON.parse(d); } catch (e) { return null; } } return d; }

  // ================= LOCAL STORAGE =================
  function ls(k, v) {
    try {
      if (v === undefined) { var s = localStorage.getItem(k); return s == null ? null : JSON.parse(s); }
      if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v));
    } catch (e) { return null; }
  }
  function cookie(name, val) {
    try {
      if (val === undefined) { var m = document.cookie.match(new RegExp("(?:^|; )" + name + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : null; }
      document.cookie = name + "=" + (val === null ? "; max-age=0" : enc(val) + "; max-age=" + 157680000) + "; path=/; SameSite=Lax";
    } catch (e) { return null; }
  }

  // ================= HELPERS =================
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function low(s) { return String(s || "").toLowerCase(); }
  function showName(n) { return low(n) === "dminfork" ? "dminFoRk" : n; }
  function toast(text, kind) {
    var el = document.createElement("div"); el.className = "toast " + (kind || ""); el.textContent = text;
    $("toasts").appendChild(el);
    setTimeout(function () { el.remove(); }, 3800);
  }
  var COLORS = ["#111111", "#e11d2e", "#3a3a40", "#b3121f", "#55555c", "#c81e36", "#26262b", "#8f1020"];
  function colorFor(n) { var h = 0; n = low(n); for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) | 0; return COLORS[Math.abs(h) % COLORS.length]; }

    return "group_messages?group_name=eq." + enc(low(o.name)) + "&select=" + sel;
  }
  var imgCache = {};   // "from|created_at" -> dataURL
  var loading = false;
  function loadThread(first) {
    if (!open || loading) return Promise.resolve();
    var o = open, key = chatKey(o);
    loading = true;
    return get(threadPath(o, "from_user,body,created_at") + "&order=created_at.desc&limit=300", 15000).then(function (rows) {
      if (!open || chatKey(open) !== key) return;
      rows.reverse();
      var msgs = rows.map(function (r) {
        var m = { from: low(r.from_user), text: r.body, time: new Date(r.created_at).getTime(), stamp: r.created_at };
        if (!r.body) m.image = imgCache[m.from + "|" + r.created_at] || "loading";
        return m;
      });
      // keep my unsent messages on screen
      pending.forEach(function (p) {
        if (p.key !== key) return;
        if (msgs.some(function (m) { return m.from === p.from && Math.abs(m.time - p.time) < 1500; })) return;
        msgs.push({ from: p.from, text: p.text, image: p.image, time: p.time, pending: true, failed: p.failed });
      });
      msgs.sort(function (a, b) { return a.time - b.time; });
      thread = msgs;
      renderThread(first);
      markRead();
      // fill in photos we don't have yet
      msgs.forEach(function (m) {
        if (m.image !== "loading") return;
        var ck = m.from + "|" + m.stamp;
        get(threadPath(o, "image") + "&from_user=eq." + enc(m.from) + "&created_at=eq." + enc(m.stamp) + "&limit=1", 30000).then(function (r) {
          imgCache[ck] = (r[0] && r[0].image) || "";
          if (open && chatKey(open) === key) { thread.forEach(function (x) { if (x.from + "|" + x.stamp === ck) x.image = imgCache[ck]; }); renderThread(false, true); }
        }).catch(function () {});
      });
      // keep the sidebar preview in sync with what's on screen
      var last = msgs[msgs.length - 1];
      if (last && !last.pending) {
        if (o.type === "dm") { dmConvos[o.who] = { last: { from: last.from, text: last.text, time: last.time } }; }
        else groupLast[low(o.name)] = { from: last.from, text: last.text, time: last.time };
        renderSide();
      }
    }).catch(function () {
      if (first && open && chatKey(open) === key) $("msgs").innerHTML = '<div class="empty">Couldn\'t load messages. Retrying…</div>';
    }).then(function () { loading = false; });
  }

  var lastRenderSig = "", pinned = true;
  $("msgs").addEventListener("scroll", function () {
    var el = $("msgs"); pinned = el.scrollHeight - el.scrollTop - el.clientHeight < 90;
  }, { passive: true });

  function renderThread(force, imagesOnly) {
    var sig = thread.map(function (m) { return m.from + m.time + (m.pending ? "p" : "") + (m.failed ? "f" : "") + (m.image ? m.image.length : 0); }).join(",");
    if (sig === lastRenderSig && !force) return;
    lastRenderSig = sig;
    var el = $("msgs"), wasPinned = pinned || force;
    var isGroup = open.type === "gc";
    if (!thread.length) { el.innerHTML = '<div class="empty">No messages yet. Say hi! 👋</div>'; return; }
    var html = "", lastDay = "", lastFrom = null, lastT = 0;
    thread.forEach(function (m) {
      var day = new Date(m.time).toDateString();
      if (day !== lastDay) { html += '<div class="day">' + fmtDay(m.time) + "</div>"; lastDay = day; lastFrom = null; }
      var mine = m.from === me;
      var showFrom = isGroup && !mine && (m.from !== lastFrom || m.time - lastT > 300000);
      var body;
      if (m.text) body = esc(m.text);
      else if (m.image === "loading") body = '<span style="opacity:.7">📷 Loading photo…</span>';
      else if (m.image) body = '<img src="' + esc(m.image) + '" alt="Photo" onclick="viewImg(this.src)">';
      else body = '<span style="opacity:.7">📷 Photo</span>';
      html += '<div class="b-wrap ' + (mine ? "mine" : "theirs") + (m.pending ? " pending" : "") + (m.failed ? " failed" : "") + '">' +
        (showFrom ? '<div class="b-from' + (isDev(m.from) ? " dev" : "") + '">@' + esc(showName(m.from)) + devTag(m.from) + "</div>" : "") +
        '<div class="bubble">' + body + "</div>" +
        '<div class="b-time">' + (m.failed ? "Not sent — tap Send again to retry" : m.pending ? "Sending…" : fmtTime(m.time)) + "</div></div>";
      lastFrom = m.from; lastT = m.time;
    });
    el.innerHTML = html;
    if (wasPinned) {
      el.scrollTop = el.scrollHeight;
      // photos change height after they load
      el.querySelectorAll("img").forEach(function (img) { if (!img.complete) img.onload = function () { if (pinned) el.scrollTop = el.scrollHeight; }; });
    }
  }
  window.viewImg = function (src) {
    showModal('<img src="' + esc(src) + '" style="width:100%;border-radius:10px"><div class="row-btns"><button class="btn ghost" onclick="closeModal()">Close</button></div>');
  };

  // ---- sending (a message stays on screen as "Sending…" until the server confirms it) ----
  function savePending() { ls("hd_pending", pending.map(function (p) { var c = Object.assign({}, p); return c; })); }
  function queueMessage(text, image) {
    if (!open) return;
    var o = open, p = { key: chatKey(o), from: me, text: text || null, image: image || null, time: Date.now() };
    if (o.type === "dm") { var pr = pair(me, o.who); p.a = pr[0]; p.b = pr[1]; } else p.group = low(o.name);
    pending.push(p); savePending();
    thread.push({ from: me, text: p.text, image: p.image, time: p.time, pending: true });
    pinned = true; renderThread(true);
    if (o.type === "dm") dmConvos[o.who] = { last: { from: me, text: p.text, time: p.time } };
    else groupLast[low(o.name)] = { from: me, text: p.text, time: p.time };
    renderSide();
    flushPending();
  }
  var sending = {};
  function flushPending() {
    pending.forEach(function (p) {
      var sk = p.key + "|" + p.time;
      if (sending[sk] || p.from !== me) return;
      sending[sk] = true;
      var iso = new Date(p.time).toISOString();
      var row = p.group != null
        ? { group_name: p.group, from_user: p.from, body: p.text, created_at: iso, image: p.image }
        : { user_a: p.a, user_b: p.b, from_user: p.from, body: p.text, created_at: iso, image: p.image };
      postRow(p.group != null ? "group_messages" : "direct_messages", row).then(function (r) {
        if (r.ok || r.status === 409) {
          pending = pending.filter(function (x) { return !(x.key === p.key && x.time === p.time); });
          savePending();
          if (p.image) imgCache[p.from + "|" + iso] = p.image;
          if (open && chatKey(open) === p.key) loadThread();
          return;
        }
        return r.text().then(function (t) {
          if (r.status >= 400 && r.status < 500 && r.status !== 408 && r.status !== 429) {
            p.failed = true; savePending();
            toast("A message couldn't be sent (server said " + r.status + ").", "warn");
            if (open && chatKey(open) === p.key) loadThread();
          }
        });
      }).catch(function () { /* offline: try again on the next tick */ }).then(function () { delete sending[sk]; });
    });
  }
  window.sendText = function () {
    var ta = $("compose"), text = ta.value.trim();
    // tapping Send with an empty box retries anything that failed in this chat
    if (!text) {
      var k = open && chatKey(open), any = false;
      pending.forEach(function (p) { if (p.key === k && p.failed) { p.failed = false; any = true; } });
      if (any) { savePending(); flushPending(); loadThread(); }
      return;
    }
    ta.value = ""; autoGrow();
    queueMessage(text, null);
    ta.focus();
  };
  window.sendPhoto = function (input) {
    var f = input.files && input.files[0]; input.value = "";
    if (!f || !/^image\//.test(f.type)) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var max = 900, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      queueMessage(null, c.toDataURL("image/jpeg", 0.78));
    };
    img.onerror = function () { toast("That photo couldn't be opened.", "warn"); };
    img.src = url;
  };
  function autoGrow() { var ta = $("compose"); ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; }
  $("compose").addEventListener("input", autoGrow);
  $("compose").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); }
  });

  // ================= GROUPS =================
  function saveGroup(g) {
    var key = GRP + low(g.name), data = { name: g.name, members: g.members, creator: g.creator || null, createdAt: g.createdAt || Date.now() };
    return send("PATCH", "avatars?username=eq." + enc(key), { data: data }, "return=representation").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (rows) {
      if (rows && rows.length) return;
      return send("POST", "avatars", { username: key, data: data }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); });
    });
  }
  function userPicker(selected, onChange) {
    var id = "pk" + Math.random().toString(36).slice(2, 7);
    window[id] = { sel: selected, cb: onChange };
    return '<input class="inp" placeholder="Search usernames…" oninput="pickerFilter(\'' + id + '\',this.value)"><div class="pick" id="' + id + '"></div>';
  }
  window.pickerFilter = function (id, q) {
    var st = window[id], box = $(id); if (!box) return;
    q = low(q.trim());
    var names = allUsers.map(function (u) { return u.username; }).filter(function (n) { return n !== me && st.sel.indexOf(n) === -1 && (!q || n.indexOf(q) !== -1); }).sort().slice(0, 30);
    box.innerHTML = names.map(function (n) { return '<button class="row" onclick="pickerAdd(\'' + id + '\',\'' + esc(n).replace(/'/g, "\\'") + '\')">' + avatar(n, "sm") + '<div class="meta"><div class="nm">@' + esc(showName(n)) + "</div></div></button>"; }).join("") ||
      '<div class="empty" style="padding:12px">No matches</div>';
  };
  window.pickerAdd = function (id, n) { var st = window[id]; st.sel.push(n); st.cb(); };

  window.openNewGroup = function () {
    var sel = [];
    function draw() {
      showModal('<h3>New group chat</h3>' +
        '<div class="field"><label>Group name</label><input class="inp" id="ng-name" maxlength="30" placeholder="e.g. Study crew" value="' + esc(($("ng-name") || {}).value || "") + '"></div>' +
        '<div class="field"><label>Members</label><div class="chips">' + (sel.length ? sel.map(function (n, i) { return '<span class="chip">@' + esc(showName(n)) + '<button onclick="ngRemove(' + i + ')">×</button></span>'; }).join("") : '<span style="color:var(--muted);font-size:13px">Add at least one person</span>') + "</div>" +
        userPicker(sel, draw) + "</div>" +
        '<div class="row-btns"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="ng-go" onclick="ngCreate()">Create</button></div>');
      pickerFilter(Object.keys(window).filter(function (k) { return /^pk/.test(k) && window[k] && window[k].sel === sel; }).pop(), "");
    }
    window.ngRemove = function (i) { sel.splice(i, 1); draw(); };
    window.ngCreate = function () {
      var name = $("ng-name").value.trim().replace(/\s+/g, " ");
      if (name.length < 2) return toast("Give the group a name (2+ characters).", "warn");
      if (low(name) === "everyone" || name.indexOf("::") !== -1 || /^(sg:|court:|__)/i.test(name)) return toast("That group name isn't allowed.", "warn");
      if (!sel.length) return toast("Add at least one person.", "warn");
      var btn = $("ng-go"); btn.disabled = true; btn.textContent = "Creating…";
      get("avatars?username=eq." + enc(GRP + low(name)) + "&select=username", 10000).then(function (rows) {
        if (rows.length) throw new Error("A group with that name already exists. Pick another name.");
        var g = { name: name, members: [me].concat(sel), creator: me, createdAt: Date.now() };
        return saveGroup(g).then(function () {
          groups.push(g); closeModal(); setTab("gc"); openGroup(g.name);
          toast("Group created!", "ok");
        });
      }).catch(function (e) {
        toast(/HTTP|timeout|fetch/i.test(e.message) ? "Couldn't create the group. Try again." : e.message, "warn");
        btn.disabled = false; btn.textContent = "Create";
      });
    };
    draw();
    setTimeout(function () { var n = $("ng-name"); if (n) n.focus(); }, 30);
  };

  window.openGroupInfo = function () {
    if (!open || open.type !== "gc") return;
    var g = groups.find(function (x) { return low(x.name) === low(open.name); });
    if (!g) return;
    var canManage = low(g.creator) === me || isDev(me) || !g.creator;
    var adding = [];
    function draw() {
      var h = "<h3>" + esc(g.name) + "</h3>" +
        '<div style="color:var(--muted);font-size:13px">Made by @' + esc(showName(g.creator || "?")) + "</div>" +
        '<div class="sect"><h4>Members (' + g.members.length + ")</h4>" +
        g.members.map(function (m) {
          var lm = low(m);
          return '<div class="row" style="cursor:default">' + avatar(lm, "sm") + '<div class="meta"><div class="nm">@' + esc(showName(lm)) + devTag(lm) + (low(g.creator) === lm ? ' <span style="color:var(--muted);font-size:11px">(owner)</span>' : "") + "</div></div>" +
            (canManage && lm !== me ? '<button class="btn ghost" style="width:auto;padding:5px 10px;font-size:12px" onclick="giRemove(\'' + esc(lm).replace(/'/g, "\\'") + '\')">Remove</button>' : "") + "</div>";
        }).join("") + "</div>" +
        '<div class="sect"><h4>Add people</h4>' +
        (adding.length ? '<div class="chips">' + adding.map(function (n, i) { return '<span class="chip">@' + esc(showName(n)) + '<button onclick="giUnadd(' + i + ')">×</button></span>'; }).join("") + "</div>" +
          '<button class="btn" style="margin-bottom:8px" onclick="giAdd()">Add ' + adding.length + (adding.length === 1 ? " person" : " people") + "</button>" : "") +
        userPicker(adding.concat(g.members.map(low)), draw) + "</div>" +
        '<div class="row-btns"><button class="btn red" onclick="giLeave()">' + (low(g.creator) === me ? "Delete group" : "Leave group") + '</button><button class="btn ghost" onclick="closeModal()">Close</button></div>';
      showModal(h);
      // the picker shares a list with members; split additions back out
      var pk = Object.keys(window).filter(function (k) { return /^pk/.test(k) && window[k] && window[k].cb; }).pop();
      var st = window[pk], base = g.members.map(low);
      st.cb = function () { adding = st.sel.filter(function (n) { return base.indexOf(n) === -1; }); draw(); };
      pickerFilter(pk, "");
    }
    function commit(newMembers, msg) {
      var before = g.members.slice();
      g.members = newMembers;
      saveGroup(g).then(function () { toast(msg, "ok"); draw(); renderSide(); openGroupHeaderRefresh(); })
        .catch(function () { g.members = before; toast("Couldn't save that change. Try again.", "warn"); draw(); });
    }
    window.giUnadd = function (i) { adding.splice(i, 1); draw(); };
    window.giAdd = function () { var a = adding.slice(); adding = []; commit(g.members.concat(a), "Added to the group."); };
    window.giRemove = function (n) { commit(g.members.filter(function (m) { return low(m) !== n; }), "Removed @" + showName(n) + "."); };
    window.giLeave = function () {
      var owner = low(g.creator) === me;
      if (!confirm(owner ? "Delete \"" + g.name + "\" for everyone?" : "Leave \"" + g.name + "\"?")) return;
      var p = owner
        ? send("DELETE", "avatars?username=eq." + enc(GRP + low(g.name))).then(function (r) { if (!r.ok) throw new Error(); })
        : (g.members = g.members.filter(function (m) { return low(m) !== me; }), saveGroup(g));
      p.then(function () {
        g._gone = true;
        groups = groups.filter(function (x) { return x !== g; });
        closeModal(); closeChat(); renderSide(); updateBadges();
        toast(owner ? "Group deleted." : "You left the group.", "ok");
      }).catch(function () { toast("Couldn't do that right now. Try again.", "warn"); });
    };
    draw();
  };
  function openGroupHeaderRefresh() {
    if (!open || open.type !== "gc") return;
    var g = groups.find(function (x) { return low(x.name) === low(open.name); });
    if (g) $("ch-sub").textContent = g.members.length + " members";
  }

  // ================= ACCOUNT =================
  window.openAccount = function () {
    showModal('<div style="display:flex;align-items:center;gap:12px">' + avatar(me) + '<div><h3 style="margin:0">@' + esc(showName(me)) + devTag(me) + '</h3><div style="color:var(--muted);font-size:13px">Your account</div></div></div>' +
      '<div class="sect"><h4>Change password</h4>' +
      '<div class="field"><input class="inp" type="password" id="cp-old" placeholder="Current password" autocomplete="current-password"></div>' +
      '<div class="field"><input class="inp" type="password" id="cp-new" placeholder="New password (4+ characters)" autocomplete="new-password"></div>' +
      '<div class="field"><input class="inp" type="password" id="cp-new2" placeholder="New password again" autocomplete="new-password"></div>' +
      '<button class="btn" id="cp-go" onclick="changePassword()">Update password</button></div>' +
      '<div class="row-btns"><button class="btn red" onclick="logout()">Log out</button><button class="btn ghost" onclick="closeModal()">Close</button></div>');
  };
  window.changePassword = function () {
    var o = $("cp-old").value, n = $("cp-new").value, n2 = $("cp-new2").value, btn = $("cp-go");
    if (n.length < 4) return toast("New password must be at least 4 characters.", "warn");
    if (n !== n2) return toast("The new passwords don't match.", "warn");
    btn.disabled = true; btn.textContent = "Checking…";
    checkLogin(me, o).then(function (ok) {
      if (ok === null) throw new Error("timeout");
      if (!ok) throw new Error("Your current password is wrong.");
      return send("POST", "rpc/change_password", { u: me, old_p: o, new_p: n });
    }).then(function (r) {
      if (!r.ok) throw new Error("Couldn't update it (server said " + r.status + ").");
      return r.json();
    }).then(function (ok) {
      if (ok !== true && ok !== "true") throw new Error("Your current password is wrong.");
      toast("Password updated.", "ok"); closeModal();
    }).catch(function (e) {
      toast(/timeout|fetch/i.test(e.message) ? "Couldn't reach the server." : e.message, "warn");
      btn.disabled = false; btn.textContent = "Update password";
    });
  };

  // ================= MODAL =================
  window.showModal = function (html) {
    $("modal-root").innerHTML = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">' + html + "</div></div>";
  };
  window.closeModal = function () { $("modal-root").innerHTML = ""; };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  // ================= LOOPS =================
  var tFast = null, tSlow = null;
  function startLoops() {
    stopLoops();
    tFast = setInterval(function () {
      if (document.hidden) return;
      flushPending();
      if (open) loadThread();
    }, 3000);
    tSlow = setInterval(function () {
      if (document.hidden) return;
      Promise.all([loadDmList(), loadGroups()]).then(function () { renderSide(); updateBadges(); });
    }, 12000);
  }
  function stopLoops() { clearInterval(tFast); clearInterval(tSlow); }
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden && me) { flushPending(); if (open) loadThread(); refreshAll(); }
  });
  window.addEventListener("online", function () { if (me) { flushPending(); refreshAll(); } });

  // ================= START =================
  if (SB.indexOf("PASTE_") === 0 || KEY.indexOf("PASTE_") === 0) {
    authMsg("Setup needed: paste your Supabase Project URL and key at the top of the code (look for PASTE_YOUR_PROJECT_URL_HERE).");
    $("li-btn").disabled = $("su-btn").disabled = true;
    return;
  }
  var saved = ls("hd_session");
  if (saved) {
    // re-check the saved login quietly (ban or deleted account logs you out)
    me = low(saved);
    enterApp(me);
    Promise.all([get("users?username=eq." + enc(me) + "&select=username", 10000), banStatus(me)]).then(function (r) {
      if (!r[0].length) { logout(); authMsg("That account no longer exists."); }
      else if (r[1]) { logout(); authMsg(r[1]); }
    }).catch(function () {});
  }
  get("users?select=username&limit=1", 8000).catch(function () {});   // wake the server
})();
</script>
</body>
</html>
